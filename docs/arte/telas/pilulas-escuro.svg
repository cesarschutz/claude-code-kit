<svg xmlns="http://www.w3.org/2000/svg" width="1173" height="36" viewBox="0 0 1173 36"><style>:root{color-scheme:dark;--fundo:#ffffff;--tinta:#141413;--fraco:#6f6e6b;--cabeca:#5d5c59;--fio:#e3e1dc;--botao:#ffffff;--botao-fio:#d9d7d2;--tecla:#8f8e8b;--tecla-fio:#e0dedb;--cartao-fio:#c9c7c2;--codigo-fundo:rgba(128,128,128,.12);--c-subtle:#8a8884;--c-suggestion:#5769f7;--c-success:#1a7f37;--c-error:#cf222e;--c-claude:#d77757;--c-warning:#9a6700;--c-merged:#8957e5;--c-planMode:#1b7c83;--c-inactive:#8c959f;--c-ide:#0969da}@media all{:root{--fundo:#191918;--tinta:#e8e6e3;--fraco:#8f8d89;--cabeca:#a8a6a2;--fio:#34322f;--botao:#30302f;--botao-fio:#45443f;--tecla:#8a8884;--tecla-fio:#4e4c48;--cartao-fio:#6d6b66;--codigo-fundo:rgba(255,255,255,.08);--c-subtle:#6e6c68;--c-suggestion:#b1b9f9;--c-success:#4eba65;--c-error:#ff6b80;--c-claude:#d77757;--c-warning:#ffc107;--c-merged:#af87ff;--c-planMode:#48968c;--c-inactive:#999999;--c-ide:#4782c8}}.tela{background:var(--fundo);color:var(--tinta);font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;line-height:19px;box-sizing:border-box;border-radius:12px;border:1px solid var(--fio);overflow:hidden}.cabeca{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 2px;color:var(--cabeca);font-size:12px}.fraco{color:var(--fraco)}.btn{display:inline-flex;align-items:center;column-gap:6px;height:25px;padding:0 9px;border:1px solid var(--botao-fio);border-radius:7px;background:var(--botao);color:var(--tinta);white-space:pre;vertical-align:top}.btn.apagado{color:var(--fraco)}.tecla{display:inline-block;min-width:11px;padding:0 3px;border:1px solid var(--tecla-fio);border-radius:4px;font-size:10.5px;line-height:15px;color:var(--tecla);text-align:center;font-weight:400}.cartao{border:1px solid var(--cartao-fio);border-radius:10px;padding-top:6px;padding-bottom:6px}.codigo{display:inline;padding:0 4px;border-radius:4px;background:var(--codigo-fundo);font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px}.md p{margin:0}.md ul,.md ol{margin:0;padding-left:22px}.md li{margin:0}.md pre{margin:0;white-space:pre-wrap;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px}.entrada{display:inline-flex;align-items:center;height:25px;padding:0 9px;border:1px solid var(--botao-fio);border-radius:7px;color:var(--fraco);white-space:pre}.marca{position:absolute;width:22px;height:22px;border-radius:11px;background:#d97757;color:#fff;font:700 12px/22px -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;text-align:center;box-shadow:0 0 0 2px var(--fundo)}</style><foreignObject x="0" y="0" width="1173" height="36"><div xmlns="http://www.w3.org/1999/xhtml"><div style="position:relative;width:1173px;height:36px"><div id="tela" class="tela" style="display:inline-block;border:0;border-radius:0;padding:8px 10px"><div style="display:flex;flex-direction:column;box-sizing:border-box;min-width:0;overflow:hidden"><div style="display:flex;flex-direction:row;box-sizing:border-box;min-width:0;overflow:hidden"></div><div style="display:flex;flex-direction:row;box-sizing:border-box;min-width:0;overflow:hidden"><img alt="CSR Lens. A conversa principal está trabalhando neste turno. 1 subagente rodando em paralelo. Git: repositório claude-code-kit · ramo main · 4 arquivos sem commit. Contexto: 52% da janela · 104,8k de 200k tokens · +3,2k no último turno. Custo da sessão: US$ 2,74 · último turno US$ 0,75. Limite de 5 h: 3% usado · renova em 4h01. Limite de 7 dias: 79% usado · renova em 4d. Modelo da conversa principal: Opus 5.5 · esforço high. Cache: 95% da entrada da última resposta veio do cache (99,6k de 104,8k tokens); quanto mais, mais barato o turno" src="data:image/svg+xml;base64," width="1153" height="20" style="display:block;flex-shrink:0;max-width:100%;height:auto"/></div></div></div></div></div></foreignObject></svg>
